<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vethic AI | Hệ Thống Đang Bảo Trì Nâng Cấp</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
      overflow: hidden;
    }

    /* Soft ambient background glows matching Vethic colors */
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .decor-circle-1 {
      position: absolute;
      top: -10%;
      left: 20%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      filter: blur(60px);
    }

    .decor-circle-2 {
      position: absolute;
      bottom: -10%;
      right: 20%;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.07) 0%, transparent 70%);
      filter: blur(60px);
    }

    /* Main Clean Card */
    .card-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.06), 0 0 1px 1px rgba(15, 23, 42, 0.02);
      text-align: center;
      animation: cardFadeIn 0.5s ease-out;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo Container with subtle smooth aura */
    .logo-wrapper {
      position: relative;
      width: 92px;
      height: 92px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-halo {
      position: absolute;
      inset: -6px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(6, 182, 212, 0.25));
      filter: blur(14px);
      animation: pulseAura 3.5s ease-in-out infinite alternate;
    }

    .logo-box {
      position: relative;
      width: 80px;
      height: 80px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.12), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      animation: floatSmooth 4s ease-in-out infinite alternate;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes pulseAura {
      0% {
        opacity: 0.4;
        transform: scale(0.96);
      }

      100% {
        opacity: 0.8;
        transform: scale(1.05);
      }
    }

    @keyframes floatSmooth {
      0% {
        transform: translateY(0px);
      }

      100% {
        transform: translateY(-5px);
      }
    }

    /* Brand Name */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .brand-ai {
      color: #059669;
      font-size: 0.95rem;
      font-weight: 900;
    }

    /* Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
      animation: blinkDot 1.6s ease-in-out infinite;
    }

    @keyframes blinkDot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    /* Clean Heading & Message */
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      line-height: 1.35;
    }

    p.subtext {
      color: #64748b;
      font-size: 0.925rem;
      font-weight: 500;
      margin-bottom: 1.75rem;
    }

    /* Clean Reload Button */
    .btn-reload {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.8rem 1.5rem;
      border-radius: 14px;
      background: #059669;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-reload:hover {
      background: #047857;
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.28);
    }

    .btn-reload:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <!-- Ambient background lighting -->
  <div class="bg-decor">
    <div class="decor-circle-1"></div>
    <div class="decor-circle-2"></div>
  </div>

  <div class="card-container">
    <!-- Brand Logo -->
    <div class="logo-wrapper">
      <div class="logo-halo"></div>
      <div class="logo-box">
        <img src="logo.png" alt="Vethic AI"
          onerror="if(!this.dataset.triedRoot){this.dataset.triedRoot='1'; this.src='/logo.png';}" />
      </div>
    </div>

    <!-- Brand Label -->
    <div class="brand-header">
      <span class="brand-title">Vethic</span>
      <span class="brand-ai">AI</span>
    </div>

    <!-- Status Badge -->
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Bảo trì định kỳ</span>
    </div>

    <!-- Notification Header & Subtext -->
    <h1>Hệ thống đang bảo trì nâng cấp</h1>
    <p class="subtext">Vui lòng quay lại sau</p>

    <!-- Simple Clean Reload Button -->
    <button class="btn-reload" onclick="window.location.reload()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
      </svg>
      <span>Tải lại trang</span>
    </button>
  </div>
</body>

</html>
